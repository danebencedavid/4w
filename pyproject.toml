[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "debrecen-weather-calibration"
version = "0.1.0"
description = "Adaptive probabilistic weather forecast calibration for Debrecen, Hungary."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "matplotlib",
  "plotly",
  "requests",
  "PyYAML",
  "joblib"
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
dashboard = ["streamlit"]

[project.scripts]
debrecen-weather = "debrecen_weather.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
